<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<title>Galerie hanby – Shopaholic Adel</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --fg:#e8eaed; --muted:#8b919c; --acc:#fe2c55; --acc2:#25f4ee; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 20px 8px; max-width:900px; margin:auto; }
  .hero { position:relative; overflow:hidden; text-align:center; padding:26px 16px 22px; margin-bottom:14px;
          border-radius:14px; border:1px solid var(--line);
          background:radial-gradient(120% 140% at 0% 0%, rgba(254,44,85,.28), transparent 55%),
                     radial-gradient(120% 140% at 100% 100%, rgba(37,244,238,.22), transparent 55%), var(--card); }
  .hero::before { content:""; position:absolute; inset:7px; border:1px dashed rgba(255,255,255,.14); border-radius:10px; pointer-events:none; }
  .hero h1 { margin:0; font-size:clamp(30px, 7vw, 52px); line-height:1.05; font-weight:900; letter-spacing:.5px; text-transform:uppercase;
             background:linear-gradient(90deg, var(--acc), #ff9bb0 50%, var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .sub { margin-top:8px; font-size:clamp(17px, 3.6vw, 24px); font-weight:700; color:#fff; }
  .hero .sub::before, .hero .sub::after { content:"🛍️"; margin:0 8px; }
  .hero .who { margin-top:10px; color:var(--muted); font-size:14px; }
  .hero .who span { color:var(--fg); font-weight:600; }
  .status { position:relative; margin-top:12px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .pill { font-size:13px; padding:4px 11px; border-radius:999px; background:rgba(0,0,0,.35); border:1px solid var(--line); color:var(--muted); }
  .pill::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; background:currentColor; vertical-align:1px; }
  .pill b { color:var(--fg); font-weight:600; }
  .pill.on { color:#4ade80; border-color:rgba(74,222,128,.35); }
  .pill.on::before { animation:pulse 2s infinite; }
  .pill.off { color:#ff6b86; border-color:rgba(254,44,85,.45); }
  .pill .rec { color:#ff6b86; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  select, button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  .tabs button.on { border-color:var(--acc); color:#fff; background:#2a1820; }
  main { max-width:900px; margin:auto; padding:8px 20px 40px; }
  .stats { display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:130px; }
  .stat b { display:block; font-size:20px; }
  .stat small { color:var(--muted); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .rank { width:42px; font-weight:700; color:var(--muted); }
  tr:nth-child(1) .rank { color:#ffd54a; } tr:nth-child(2) .rank { color:#c9d1d9; } tr:nth-child(3) .rank { color:#d39a62; }
  .nick { color:var(--muted); font-size:13px; }
  .barfill { height:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:2px; margin-top:4px; }
  .live { display:inline-block; background:var(--acc); color:#fff; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:6px; }
  .empty { color:var(--muted); padding:30px; text-align:center; }
  @media (max-width:560px) { .hide-sm { display:none; } .stat { min-width:0; flex:1; padding:8px 10px; } .stat b { font-size:17px; } th, td { padding:9px 8px; } header, main { padding-left:12px; padding-right:12px; } }
  footer { color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="hero">
    <h1>Galerie hanby</h1>
    <div class="sub">Shopaholic Adel</div>
    <div class="who">🎁 Žebříček dárců <span id="who"></span></div>
    <div class="status" id="collectors"></div>
  </div>
  <div class="bar">
    <select id="streamer"></select>
    <div class="tabs bar" id="tabs">
      <button data-p="all" class="on">Celkem</button>
      <button data-p="30d">30 dní</button>
      <button data-p="7d">7 dní</button>
      <button data-p="24h">24 h</button>
      <button data-p="last">Poslední LIVE</button>
    </div>
    <select id="stream"><option value="">— konkrétní vysílání —</option></select>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat"><small>Diamanty</small><b id="s-d">0</b></div>
    <div class="stat"><small>Dárců</small><b id="s-u">0</b></div>
    <div class="stat"><small>Vysílání</small><b id="s-s">0</b></div>
  </div>
  <table>
    <thead><tr><th class="rank">#</th><th>Účet</th><th class="n">💎</th><th class="n">Darů</th><th class="n hide-sm">Vysílání</th><th class="n">Naposledy</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">Načítám…</td></tr></tbody>
  </table>
  <footer><p>Obnovuje se každých 10 s. Sběrač je offline, když se 2 min neozval. 💎 = hodnota daru v mincích/diamantech podle TikToku.</p></footer>
</main>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const CFG = window.APP_CONFIG || {};
let period = "all", streamId = "";
const fmt = n => Number(n || 0).toLocaleString("cs-CZ");
const ts = t => new Date(t).getTime() / 1000;
const ago = t => {
  if (!t) return "";
  const s = Date.now()/1000 - ts(t);
  if (s < 3600) return Math.max(1, Math.round(s/60)) + " min";
  if (s < 86400) return Math.round(s/3600) + " h";
  return Math.round(s/86400) + " d";
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Volání funkcí v Supabase (PostgREST RPC) – bez další knihovny
async function rpc(fn, args = {}) {
  const headers = { "apikey": CFG.supabaseKey, "Content-Type": "application/json" };
  if ((CFG.supabaseKey || "").startsWith("eyJ")) headers["Authorization"] = "Bearer " + CFG.supabaseKey;
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(args) });
  if (!r.ok) throw new Error(`${fn}: ${r.status} ${await r.text()}`);
  return r.json();
}

function showError(msg) {
  $("#rows").innerHTML = `<tr><td colspan="6" class="empty">⚠️ ${esc(msg)}</td></tr>`;
}

async function loadStreamers() {
  const list = await rpc("list_streamers");
  const names = list.map(x => x.name);
  const sel = $("#streamer");
  const want = new URLSearchParams(location.search).get("u")?.replace(/^@/, "").toLowerCase()
            || sel.value || localStorage.getItem("streamer");
  sel.innerHTML = list.map(x => `<option value="${esc(x.name)}">@${esc(x.name)}${x.live ? " 🔴" : ""}</option>`).join("");
  if (want && names.includes(want)) sel.value = want;
}

async function loadStreams() {
  const s = $("#streamer").value; if (!s) return [];
  const list = await rpc("list_streams", { p_streamer: s });
  const sel = $("#stream"), cur = sel.value;
  sel.innerHTML = '<option value="">— konkrétní vysílání —</option>' + list.map(x => {
    const d = new Date(x.started_at).toLocaleString("cs-CZ", {day:"numeric", month:"numeric", hour:"2-digit", minute:"2-digit"});
    return `<option value="${x.id}">${d}${x.ended_at ? "" : " 🔴"} · ${fmt(x.diamonds)} 💎</option>`;
  }).join("");
  sel.value = cur;
  return list;
}

// Stav sběračů (heartbeat každých 30 s; online = zpráva za poslední 2 min)
async function loadCollectors() {
  const box = $("#collectors");
  let list;
  try { list = await rpc("collector_status"); } catch (e) { console.warn(e); box.innerHTML = ""; return; }
  if (!list.length) { box.innerHTML = '<span class="pill">Sběrač zatím nehlásil stav</span>'; return; }
  box.innerHTML = list.map(c => {
    const name = `Sběrač <b>${esc(c.name)}</b>`;
    if (!c.online) return `<span class="pill off" title="Naposledy: ${esc(new Date(c.last_seen).toLocaleString("cs-CZ"))}">${name} offline · před ${ago(c.last_seen)}</span>`;
    const extra = c.recording?.length ? ' · <span class="rec">⏺ nahrává</span>'
                : c.live?.length ? " · sbírá LIVE"
                : c.record_enabled ? " · čeká na LIVE, nahrávání zapnuto" : " · čeká na LIVE";
    return `<span class="pill on" title="Běží od ${esc(new Date(c.started_at).toLocaleString("cs-CZ"))}">${name} online${extra}</span>`;
  }).join("");
}

async function refresh() {
  try {
    const s = $("#streamer").value;
    if (!s) { showError("Zatím žádný sledovaný účet – spusť sběrač."); return; }
    localStorage.setItem("streamer", s);
    const streams = await loadStreams();
    const live = streams.some(x => !x.ended_at);
    $("#who").innerHTML = "@" + esc(s) + (live ? '<span class="live">LIVE</span>' : "");
    const rows = await rpc("leaderboard", {
      p_streamer: s, p_period: period, p_stream_id: streamId ? Number(streamId) : null, p_limit: 100
    });
    const max = rows[0]?.diamonds || 1;
    $("#s-d").textContent = fmt(rows.reduce((a, r) => a + Number(r.diamonds), 0));
    $("#s-u").textContent = fmt(rows.length);
    $("#s-s").textContent = fmt(streamId || period === "last" ? Math.min(1, streams.length) : streams.length);
    $("#rows").innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td class="rank">${r.rank}</td>
        <td>@${esc(r.unique_id || r.user_id)} <span class="nick">${esc(r.nickname)}</span>
            <div class="barfill" style="width:${Math.max(2, 100*r.diamonds/max)}%"></div></td>
        <td class="n"><b>${fmt(r.diamonds)}</b></td>
        <td class="n">${fmt(r.gifts)}</td>
        <td class="n hide-sm">${r.streams}</td>
        <td class="n">${ago(r.last_ts)}</td>
      </tr>`).join("") : '<tr><td colspan="6" class="empty">Zatím žádné dary v tomto období.</td></tr>';
  } catch (e) { console.error(e); showError("Nepodařilo se načíst data: " + e.message); }
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  period = b.dataset.p; streamId = ""; $("#stream").value = ""; refresh();
});
$("#stream").addEventListener("change", e => {
  streamId = e.target.value;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", !streamId && x.dataset.p === period));
  refresh();
});
$("#streamer").addEventListener("change", () => { streamId = ""; refresh(); });

(async () => {
  if (!CFG.supabaseUrl || !CFG.supabaseKey) { showError("Chybí konfigurace Supabase (config.js)."); return; }
  try { await loadStreamers(); } catch (e) { showError(e.message); return; }
  await refresh(); loadCollectors();
  setInterval(async () => { try { await loadStreamers(); } catch {} refresh(); loadCollectors(); }, 10000);
})();
</script>
</body>
</html>
